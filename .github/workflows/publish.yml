name: publish
run-name: "${{ format('release {0}', inputs.bump) }}"

on:
  push:
    branches:
      - main
      - ci
      - dev
      - beta
      - snapshot-*
    # Test-only changes don't warrant a real release (npm/GitHub Release
    # version bump) - this only skips the push trigger, not workflow_dispatch,
    # so a manual release still works if a test-only commit needs one.
    paths-ignore:
      - "**/*.test.ts"
  workflow_dispatch:
    inputs:
      bump:
        description: "Bump major, minor, or patch"
        required: false
        type: choice
        options:
          - major
          - minor
          - patch
      version:
        description: "Override version (optional)"
        required: false
        type: string

concurrency: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.version || inputs.bump }}

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  version:
    # blacksmith-* runners require the Blacksmith GitHub App, which isn't
    # installed on this org (checked via the API - only cloudflare-workers-
    # and-pages is) - jobs on that label queue forever with no runner ever
    # picking them up. test.yml already proves ubuntu-latest/windows-latest
    # work fine here, so the lean auto-release jobs (this one, build-cli,
    # sign-cli-windows, publish-cli) use those instead.
    runs-on: ubuntu-latest
    if: github.repository == 'PAIdynamics/PhysicsCode'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-bun

      - name: Install PhysicsCode
        if: inputs.bump || inputs.version
        run: bun i -g physicscode-ai

      - id: version
        run: |
          ./script/version.ts
        env:
          # No dedicated GitHub App is provisioned for this repo (checked:
          # none installed on the PAIdynamics org) - the built-in
          # GITHUB_TOKEN already has contents:write (see `permissions:`
          # above) and needs no setup, so use it directly for all
          # same-repo release operations below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A plain push to main (not one of the other channel branches, not a
          # manual dispatch) is treated as an automatic lean patch release -
          # see the publish-cli job below for what that path actually
          # publishes (CLI binaries + npm only, no desktop apps/AUR/Docker).
          PHYSICSCODE_BUMP: ${{ (github.ref_name == 'main' && github.event_name == 'push' && 'patch') || inputs.bump }}
          PHYSICSCODE_VERSION: ${{ inputs.version }}
          PHYSICSCODE_API_KEY: ${{ secrets.PHYSICSCODE_API_KEY }}
          GH_REPO: ${{ (github.ref_name == 'beta' && 'anomalyco/physicscode-beta') || github.repository }}
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
      tag: ${{ steps.version.outputs.tag }}
      repo: ${{ steps.version.outputs.repo }}

  build-cli:
    needs: version
    runs-on: ubuntu-latest
    if: github.repository == 'PAIdynamics/PhysicsCode'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - uses: ./.github/actions/setup-bun

      - name: Build
        id: build
        run: |
          ./packages/physicscode/script/build.ts ${{ (github.ref_name == 'beta' && '--sourcemaps') || '' }}
        env:
          PHYSICSCODE_VERSION: ${{ needs.version.outputs.version }}
          PHYSICSCODE_RELEASE: ${{ needs.version.outputs.release }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: physicscode-cli
          path: |
            packages/physicscode/dist/physicscode-darwin*
            packages/physicscode/dist/physicscode-linux*

      - uses: actions/upload-artifact@v4
        with:
          name: physicscode-cli-windows
          path: packages/physicscode/dist/physicscode-windows*
    outputs:
      version: ${{ needs.version.outputs.version }}

  sign-cli-windows:
    needs:
      - build-cli
      - version
    runs-on: windows-latest
    # Disabled until Azure Trusted Signing secrets are provisioned - it can
    # only fail right now (AZURE_CLIENT_ID etc are unset), so there's no
    # point spending CI minutes on it. build-cli already uploads unsigned
    # Windows archives (see build.ts) as the working baseline. Flip this
    # back to `github.repository == 'PAIdynamics/PhysicsCode'` once the
    # Azure secrets exist.
    if: false
    # Azure Trusted Signing secrets aren't provisioned yet - don't block the
    # release on this. build-cli already uploaded unsigned Windows archives
    # (see build.ts) as the working baseline; this job only improves on that
    # with a real Authenticode signature when the secrets exist.
    continue-on-error: true
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    steps:
      - uses: actions/checkout@v3

      - uses: actions/download-artifact@v4
        with:
          name: physicscode-cli-windows
          path: packages/physicscode/dist

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ env.AZURE_TRUSTED_SIGNING_ENDPOINT }}
          signing-account-name: ${{ env.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ env.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
          files: |
            ${{ github.workspace }}\packages\physicscode\dist\physicscode-windows-arm64\bin\physicscode.exe
            ${{ github.workspace }}\packages\physicscode\dist\physicscode-windows-x64\bin\physicscode.exe
            ${{ github.workspace }}\packages\physicscode\dist\physicscode-windows-x64-baseline\bin\physicscode.exe
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: Verify Windows CLI signatures
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\physicscode\dist\physicscode-windows-arm64\bin\physicscode.exe",
            "${{ github.workspace }}\packages\physicscode\dist\physicscode-windows-x64\bin\physicscode.exe",
            "${{ github.workspace }}\packages\physicscode\dist\physicscode-windows-x64-baseline\bin\physicscode.exe"
          )

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - name: Repack Windows CLI archives
        working-directory: packages/physicscode/dist
        shell: pwsh
        run: |
          Compress-Archive -Path "physicscode-windows-arm64\bin\*" -DestinationPath "physicscode-windows-arm64.zip" -Force
          Compress-Archive -Path "physicscode-windows-x64\bin\*" -DestinationPath "physicscode-windows-x64.zip" -Force
          Compress-Archive -Path "physicscode-windows-x64-baseline\bin\*" -DestinationPath "physicscode-windows-x64-baseline.zip" -Force

      - name: Upload signed Windows CLI release assets
        if: needs.version.outputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.version.outputs.version }}" `
            "${{ github.workspace }}\packages\physicscode\dist\physicscode-windows-arm64.zip" `
            "${{ github.workspace }}\packages\physicscode\dist\physicscode-windows-x64.zip" `
            "${{ github.workspace }}\packages\physicscode\dist\physicscode-windows-x64-baseline.zip" `
            --clobber `
            --repo "${{ needs.version.outputs.repo }}"

      - uses: actions/upload-artifact@v4
        with:
          name: physicscode-cli-signed-windows
          path: |
            packages/physicscode/dist/physicscode-windows-arm64
            packages/physicscode/dist/physicscode-windows-x64
            packages/physicscode/dist/physicscode-windows-x64-baseline

  build-tauri:
    needs:
      - build-cli
      - version
    # Skip on the automatic lean main-push path - desktop app builds are slow
    # and consume real Apple/Azure signing-cert usage; they stay manual
    # (workflow_dispatch) or run on the other channel branches as before.
    if: "!(github.ref_name == 'main' && github.event_name == 'push')"
    continue-on-error: false
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          # github-hosted: blacksmith lacks ARM64 MSVC cross-compilation toolchain
          - host: windows-2025
            target: aarch64-pc-windows-msvc
          - host: blacksmith-4vcpu-windows-2025
            target: x86_64-pc-windows-msvc
          - host: blacksmith-4vcpu-ubuntu-2404
            target: x86_64-unknown-linux-gnu
          - host: blacksmith-8vcpu-ubuntu-2404-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-tags: true

      - uses: apple-actions/import-codesign-certs@v2
        if: ${{ runner.os == 'macOS' }}
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Verify Certificate
        if: ${{ runner.os == 'macOS' }}
        run: |
          CERT_INFO=$(security find-identity -v -p codesigning build.keychain | grep "Developer ID Application")
          CERT_ID=$(echo "$CERT_INFO" | awk -F'"' '{print $2}')
          echo "CERT_ID=$CERT_ID" >> $GITHUB_ENV
          echo "Certificate imported."

      - name: Setup Apple API Key
        if: ${{ runner.os == 'macOS' }}
        run: |
          echo "${{ secrets.APPLE_API_KEY_PATH }}" > $RUNNER_TEMP/apple-api-key.p8

      - uses: ./.github/actions/setup-bun

      - name: Azure login
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache apt packages
        if: contains(matrix.settings.host, 'ubuntu')
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-${{ matrix.settings.target }}-apt-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-apt-

      - name: install dependencies (ubuntu only)
        if: contains(matrix.settings.host, 'ubuntu')
        run: |
          mkdir -p ~/apt-cache && chmod -R a+rw ~/apt-cache
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$HOME/apt-cache" libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
          sudo chmod -R a+rw ~/apt-cache

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
          shared-key: ${{ matrix.settings.target }}

      - name: Prepare
        run: |
          cd packages/desktop
          bun ./scripts/prepare.ts
        env:
          PHYSICSCODE_VERSION: ${{ needs.version.outputs.version }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          PHYSICSCODE_CLI_ARTIFACT: ${{ (runner.os == 'Windows' && 'physicscode-cli-windows') || 'physicscode-cli' }}
          RUST_TARGET: ${{ matrix.settings.target }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Resolve tauri portable SHA
        if: contains(matrix.settings.host, 'ubuntu')
        run: echo "TAURI_PORTABLE_SHA=$(git ls-remote https://github.com/tauri-apps/tauri.git refs/heads/feat/truly-portable-appimage | cut -f1)" >> "$GITHUB_ENV"

      # Fixes AppImage build issues, can be removed when https://github.com/tauri-apps/tauri/pull/12491 is released
      - name: Install tauri-cli from portable appimage branch
        uses: taiki-e/cache-cargo-install-action@v3
        if: contains(matrix.settings.host, 'ubuntu')
        with:
          tool: tauri-cli
          git: https://github.com/tauri-apps/tauri
          # branch: feat/truly-portable-appimage
          rev: ${{ env.TAURI_PORTABLE_SHA }}

      - name: Show tauri-cli version
        if: contains(matrix.settings.host, 'ubuntu')
        run: cargo tauri --version

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          physicscode-app-id: ${{ vars.PHYSICSCODE_APP_ID }}
          physicscode-app-secret: ${{ secrets.PHYSICSCODE_APP_SECRET }}

      - name: Build and upload artifacts
        uses: tauri-apps/tauri-action@390cbe447412ced1303d35abe75287949e43437a
        timeout-minutes: 60
        with:
          projectPath: packages/desktop
          uploadWorkflowArtifacts: true
          tauriScript: ${{ (contains(matrix.settings.host, 'ubuntu') && 'cargo tauri') || '' }}
          args: --target ${{ matrix.settings.target }} --config ${{ (github.ref_name == 'beta' && './src-tauri/tauri.beta.conf.json') || './src-tauri/tauri.prod.conf.json' }} --verbose
          updaterJsonPreferNsis: true
          releaseId: ${{ needs.version.outputs.release }}
          tagName: ${{ needs.version.outputs.tag }}
          releaseDraft: true
          releaseAssetNamePattern: physicscode-desktop-[platform]-[arch][ext]
          repo: ${{ (github.ref_name == 'beta' && 'physicscode-beta') || '' }}
          releaseCommitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          TAURI_BUNDLER_NEW_APPIMAGE_FORMAT: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ env.CERT_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_PATH: ${{ runner.temp }}/apple-api-key.p8

      - name: Verify signed Windows desktop artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @(
            "${{ github.workspace }}\packages\desktop\src-tauri\sidecars\physicscode-cli-${{ matrix.settings.target }}.exe"
          )
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop\src-tauri\target\${{ matrix.settings.target }}\release\bundle\nsis\*.exe" | Select-Object -ExpandProperty FullName

          foreach ($file in $files) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

  build-electron:
    needs:
      - build-cli
      - version
    # Skip on the automatic lean main-push path - see build-tauri above.
    if: github.repository == 'PAIdynamics/PhysicsCode' && !(github.ref_name == 'main' && github.event_name == 'push')
    continue-on-error: false
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_TRUSTED_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_TRUSTED_SIGNING_ACCOUNT_NAME }}
      AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE: ${{ secrets.AZURE_TRUSTED_SIGNING_CERTIFICATE_PROFILE }}
      AZURE_TRUSTED_SIGNING_ENDPOINT: ${{ secrets.AZURE_TRUSTED_SIGNING_ENDPOINT }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-26-intel
            target: x86_64-apple-darwin
            platform_flag: --mac --x64
            bun_install_flags: --os=darwin --cpu=x64
          - host: macos-26
            target: aarch64-apple-darwin
            platform_flag: --mac --arm64
            bun_install_flags: --os=darwin --cpu=arm64
          # github-hosted: blacksmith lacks ARM64 MSVC cross-compilation toolchain
          - host: "windows-2025"
            target: aarch64-pc-windows-msvc
            platform_flag: --win --arm64
          - host: "blacksmith-4vcpu-windows-2025"
            target: x86_64-pc-windows-msvc
            platform_flag: --win
          - host: "blacksmith-4vcpu-ubuntu-2404"
            target: x86_64-unknown-linux-gnu
            platform_flag: --linux
          - host: "blacksmith-4vcpu-ubuntu-2404"
            target: aarch64-unknown-linux-gnu
            platform_flag: --linux
    runs-on: ${{ matrix.settings.host }}
    steps:
      - uses: actions/checkout@v3

      - uses: apple-actions/import-codesign-certs@v2
        if: runner.os == 'macOS'
        with:
          keychain: build
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Setup Apple API Key
        if: runner.os == 'macOS'
        run: echo "${{ secrets.APPLE_API_KEY_PATH }}" > $RUNNER_TEMP/apple-api-key.p8

      - uses: ./.github/actions/setup-bun
        with:
          install-flags: ${{ matrix.settings.bun_install_flags }}

      - name: Azure login
        if: runner.os == 'Windows'
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Cache apt packages
        if: contains(matrix.settings.host, 'ubuntu')
        uses: actions/cache@v4
        with:
          path: ~/apt-cache
          key: ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.settings.target }}-apt-electron-

      - name: Install dependencies (ubuntu only)
        if: contains(matrix.settings.host, 'ubuntu')
        run: |
          mkdir -p ~/apt-cache && chmod -R a+rw ~/apt-cache
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o dir::cache::archives="$HOME/apt-cache" rpm
          sudo chmod -R a+rw ~/apt-cache

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          physicscode-app-id: ${{ vars.PHYSICSCODE_APP_ID }}
          physicscode-app-secret: ${{ secrets.PHYSICSCODE_APP_SECRET }}

      - name: Prepare
        run: bun ./scripts/prepare.ts
        working-directory: packages/desktop-electron
        env:
          PHYSICSCODE_VERSION: ${{ needs.version.outputs.version }}
          PHYSICSCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          PHYSICSCODE_CLI_ARTIFACT: ${{ (runner.os == 'Windows' && 'physicscode-cli-windows') || 'physicscode-cli' }}
          RUST_TARGET: ${{ matrix.settings.target }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      - name: Build
        run: bun run build
        working-directory: packages/desktop-electron
        env:
          PHYSICSCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.WEB_SENTRY_PROJECT }}
          SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}
          VITE_SENTRY_DSN: ${{ vars.WEB_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ (github.ref_name == 'beta' && 'beta') || 'production' }}
          VITE_SENTRY_RELEASE: desktop@${{ needs.version.outputs.version }}

      - name: Package and publish
        if: needs.version.outputs.release
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish always --config electron-builder.config.ts
        working-directory: packages/desktop-electron
        timeout-minutes: 60
        env:
          PHYSICSCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}
          GH_TOKEN: ${{ steps.committer.outputs.token }}
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/apple-api-key.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

      - name: Package (no publish)
        if: ${{ !needs.version.outputs.release }}
        run: npx electron-builder ${{ matrix.settings.platform_flag }} --publish never --config electron-builder.config.ts
        working-directory: packages/desktop-electron
        timeout-minutes: 60
        env:
          PHYSICSCODE_CHANNEL: ${{ (github.ref_name == 'beta' && 'beta') || 'prod' }}

      - name: Verify signed Windows Electron artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $files = @()
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop-electron\dist\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop-electron\dist\*unpacked\*.exe" | Select-Object -ExpandProperty FullName
          $files += Get-ChildItem "${{ github.workspace }}\packages\desktop-electron\dist\*unpacked\resources\physicscode-cli.exe" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

          foreach ($file in $files | Select-Object -Unique) {
            $sig = Get-AuthenticodeSignature $file
            if ($sig.Status -ne "Valid") {
              throw "Invalid signature for ${file}: $($sig.Status)"
            }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: physicscode-electron-${{ matrix.settings.target }}
          path: packages/desktop-electron/dist/*

      - uses: actions/upload-artifact@v4
        if: needs.version.outputs.release
        with:
          name: latest-yml-${{ matrix.settings.target }}
          path: packages/desktop-electron/dist/latest*.yml

  # Full publish: npm + Docker/GHCR + AUR + desktop app update manifests. Not
  # run on the automatic lean main-push path (see publish-cli below) - it
  # also does things out of scope for that path (git-tag-syncs to a `dev`
  # branch this fork doesn't use, and Docker/AUR steps that still reference
  # the stale `anomalyco` org, tracked separately).
  publish:
    needs:
      - version
      - build-cli
      - sign-cli-windows
      - build-tauri
      - build-electron
    if: always() && !failure() && !cancelled() && !(github.ref_name == 'main' && github.event_name == 'push')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-bun

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Setup git committer
        id: committer
        uses: ./.github/actions/setup-git-committer
        with:
          physicscode-app-id: ${{ vars.PHYSICSCODE_APP_ID }}
          physicscode-app-secret: ${{ secrets.PHYSICSCODE_APP_SECRET }}

      - uses: actions/download-artifact@v4
        with:
          name: physicscode-cli
          path: packages/physicscode/dist

      - uses: actions/download-artifact@v4
        with:
          name: physicscode-cli-windows
          path: packages/physicscode/dist

      - uses: actions/download-artifact@v4
        with:
          name: physicscode-cli-signed-windows
          path: packages/physicscode/dist

      - uses: actions/download-artifact@v4
        if: needs.version.outputs.release
        with:
          pattern: latest-yml-*
          path: /tmp/latest-yml

      - name: Cache apt packages (AUR)
        uses: actions/cache@v4
        with:
          path: /var/cache/apt/archives
          key: ${{ runner.os }}-apt-aur-${{ hashFiles('.github/workflows/publish.yml') }}
          restore-keys: |
            ${{ runner.os }}-apt-aur-

      - name: Setup SSH for AUR
        run: |
          sudo apt-get update
          sudo apt-get install -y pacman-package-manager
          mkdir -p ~/.ssh
          echo "${{ secrets.AUR_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          git config --global user.email "physicscode@sst.dev"
          git config --global user.name "physicscode"
          ssh-keyscan -H aur.archlinux.org >> ~/.ssh/known_hosts || true

      - run: ./script/publish.ts
        env:
          PHYSICSCODE_VERSION: ${{ needs.version.outputs.version }}
          PHYSICSCODE_RELEASE: ${{ needs.version.outputs.release }}
          AUR_KEY: ${{ secrets.AUR_KEY }}
          GITHUB_TOKEN: ${{ steps.committer.outputs.token }}
          GH_REPO: ${{ needs.version.outputs.repo }}
          NPM_CONFIG_PROVENANCE: false
          LATEST_YML_DIR: /tmp/latest-yml

  # Lean automatic release path for a plain push to main: CLI binaries (built
  # by build-cli/sign-cli-windows above) + npm only. Deliberately does NOT
  # call the root ./script/publish.ts (Docker/GHCR, AUR, SDK/plugin publish,
  # git-tag-sync to a `dev` branch this fork doesn't use) - see the comment
  # on the `publish` job above for why that's out of scope here.
  publish-cli:
    needs:
      - version
      - build-cli
      - sign-cli-windows
    # always() + explicit failure()/cancelled() checks: sign-cli-windows is
    # now skipped (if: false above), and the default implicit success() gate
    # on `needs` treats a skipped dependency as not-satisfied, which would
    # silently skip this job too.
    if: always() && !failure() && !cancelled() && github.ref_name == 'main' && github.event_name == 'push' && needs.version.outputs.release != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: ./.github/actions/setup-bun

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          name: physicscode-cli
          path: packages/physicscode/dist

      # Not physicscode-cli-signed-windows: sign-cli-windows is
      # continue-on-error (Azure signing secrets aren't provisioned yet), so
      # that artifact may not exist. This one (from build-cli, always
      # produced) has the same binaries unsigned - the working baseline.
      - uses: actions/download-artifact@v4
        with:
          name: physicscode-cli-windows
          path: packages/physicscode/dist

      - name: Publish CLI to npm
        # Optional distribution channel (npm install -g physicscode-ai), not
        # required for the physicscode.ai website - that serves downloads
        # straight from this job's GitHub Release assets. Soft-fail so a
        # missing/absent NPM_TOKEN never blocks the release itself; set the
        # NPM_TOKEN secret (an npm "Automation" access token) whenever npm
        # distribution is wanted and this will start publishing for real.
        continue-on-error: true
        run: bun ./packages/physicscode/script/publish.ts
        env:
          PHYSICSCODE_VERSION: ${{ needs.version.outputs.version }}
          PHYSICSCODE_RELEASE: ${{ needs.version.outputs.release }}
          NPM_CONFIG_PROVENANCE: false
          # OIDC "trusted publishing" only works for packages that already
          # exist on npm (you configure trust from an existing package's
          # settings page). None of these per-platform packages have ever
          # been published, so the very first publish of each one needs a
          # real token - registry-url above wires setup-node's .npmrc to
          # read auth from this env var.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # publish.ts also does Docker/AUR/Homebrew publishing when not
          # set - this job only has npm publish permissions/artifacts.
          PHYSICSCODE_LEAN: "true"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.version.outputs.tag }}" --draft=false --repo "${{ needs.version.outputs.repo }}"

      - name: Notify physicscode-website to redeploy
        # Best-effort: the CLI release above already succeeded regardless of
        # this. GITHUB_TOKEN can't reach another repo, so this needs a
        # separate credential with write access to
        # PAIdynamics/physicscode-website (a fine-grained PAT, or a GitHub
        # App installed on both repos) added as this secret; until then it
        # fails visibly here without blocking the release itself.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.PHYSICSCODE_WEBSITE_DISPATCH_TOKEN }}
        run: |
          gh api repos/PAIdynamics/physicscode-website/dispatches \
            -f event_type=cli-release \
            -F "client_payload[version]=${{ needs.version.outputs.version }}"
