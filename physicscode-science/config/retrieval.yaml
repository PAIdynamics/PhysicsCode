retrieval:
  default_top_k: 10
  max_context_tokens: 6000
  dense_enabled: true
  vector_index:
    default_backend: local_json
    production_backend: qdrant
    local_path: .science/vector-index.json
    dimensions: 1536
    qdrant_url_env: PHYSICSCODE_SCIENCE_QDRANT_URL
    qdrant_backend_env: PHYSICSCODE_SCIENCE_VECTOR_BACKEND
    qdrant_collection_env: PHYSICSCODE_SCIENCE_QDRANT_COLLECTION
    qdrant_default_collection: physicscode_science_summary
  sparse_enabled: true
  symbol_enabled: true
  license_filter:
    - MIT
    - BSD-2-Clause
    - BSD-3-Clause
    - Apache-2.0
