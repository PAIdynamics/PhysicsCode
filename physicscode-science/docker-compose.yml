services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: physicscode
      POSTGRES_PASSWORD: physicscode
      POSTGRES_DB: physicscode_science
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U physicscode"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.4
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./.science/qdrant-storage:/qdrant/storage
